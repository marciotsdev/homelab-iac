domain_suffix: homelab

gitea_port: 3000
gitea_ssh_port: 2222
gitea_domain: "gitea.{{ domain_suffix }}"
gitea_admin_user: gitadmin
gitea_demo_repo: sample-app
jenkins_port: 8080
awx_port: 30080
backstage_port: 7007
awx_job_template_id: 9

# GitLab — git + CI desde jul/2026 (substituiu o Jenkins)
gitlab_http_port: 8088
gitlab_ssh_port: 2224
gitlab_external_host: "{{ homelab_hosts.gitlab }}"
gitlab_url: "http://{{ homelab_hosts.gitlab }}:{{ gitlab_http_port }}"
# Host do inventario onde roda o container gitlab-server; o papel gitlab_runners
# delega a criacao dos tokens de runner para ele.
gitlab_inventory_host: gitlab

# MiniStack (emulador AWS local) + StackPort
ministack_port: 4566
stackport_port: 8080

# Keycloak (SSO, ver [[homelab-gitops]] para o deploy em si) — realm dedicado
# "homelab" (nao o "master", usado so pra administracao do proprio Keycloak).
# Serve sob o path legado /auth (chart codecentric/keycloakx).
keycloak_base_url: "https://192.168.15.59:8443/auth"
keycloak_realm: homelab

# SSH key used both to connect to the VMs and, on the awx role, to build the
# AWX machine credential. `~` is expanded against whichever user is running
# the play (locally and over SSH), so this stays portable across machines.
ssh_private_key_path: "~/.ssh/homelab_ed25519"
