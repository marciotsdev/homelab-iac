---
- name: Common baseline on all homelab VMs
  hosts: homelab
  gather_facts: true
  roles:
    - common

- name: Gitea (legacy mirror)
  hosts: gitea
  gather_facts: true
  roles:
    - gitea

- name: GitLab (git + CI)
  hosts: gitlab
  gather_facts: true
  roles:
    - gitlab

- name: GitLab runners
  hosts: gitlab-runners
  gather_facts: true
  roles:
    - gitlab_runners

# Observabilidade do lab (Elasticsearch + Logstash + Kibana). TLS/Caddy e a
# integracao com o Keycloak (oauth2-proxy) ficam pra uma fase seguinte.
- name: ELK (observabilidade)
  hosts: elk
  gather_facts: true
  roles:
    - elk

- name: MiniStack (local AWS emulator)
  hosts: localstack
  gather_facts: true
  roles:
    - ministack

- name: Containers
  hosts: containers
  gather_facts: true
  roles:
    - containers

- name: AWX
  hosts: awx
  gather_facts: true
  roles:
    - awx

- name: Backstage
  hosts: backstage
  gather_facts: true
  roles:
    - backstage
    # TLS na frente do Backstage: o frontend usa crypto.randomUUID(), que so
    # existe em contexto seguro (https:// ou localhost) — em http:// puro o app
    # quebra na inicializacao.
    - role: caddy
      caddy_sites:
        - address: "https://{{ hostvars['backstage'].ansible_host }}"
          upstream: "127.0.0.1:{{ backstage_port }}"

# Dashboard de compliance/auditoria pros achados de scan (gitleaks/trivy, ver
# root/lab-ops ci-templates/scan.yml). TLS na frente pelo mesmo motivo de
# sempre (evitar credencial/relatorio de vulnerabilidade trafegando em http).
- name: DefectDojo (compliance/auditoria)
  hosts: defectdojo
  gather_facts: true
  roles:
    - defectdojo
    - role: caddy
      caddy_sites:
        - address: "https://{{ hostvars['defectdojo'].ansible_host }}"
          upstream: "127.0.0.1:{{ defectdojo_port }}"

# DNS interno do lab (Technitium) - zona "lab" com registro pra cada servico
# ja existente (ver defaults/main.yml do papel). Pre-requisito do FQDN que o
# Uyuni precisa - a frota inteira do homelab-iac ja usa esse resolver como
# DNS primario (corte concluido em 19 ago 2026, roteador como fallback).
- name: DNS interno (Technitium)
  hosts: dns
  gather_facts: true
  roles:
    - technitium
    - role: caddy
      caddy_sites:
        - address: "https://{{ hostvars['dns'].ansible_host }}"
          upstream: "127.0.0.1:{{ technitium_web_port }}"

# Hardening + patch management + relatorio de issues centralizados pra frota
# inteira, no lugar da tentativa via Ansible devsec.hardening (revertida em
# 14 ago 2026, ver docs/armadilhas.md). Sem Caddy na frente: o mgradm ja
# publica o servidor direto em 443 com certificado proprio (autoassinado,
# CA gerada por ele mesmo) - navegador vai pedir excecao manual na primeira
# visita, diferente do "tls internal" do Caddy usado no resto do lab.
- name: Uyuni (hardening + patch management)
  hosts: uyuni
  gather_facts: true
  roles:
    - uyuni

# Onboarding da frota como Salt minion do Uyuni (Salt Bundle/venv-salt-minion).
# Roda depois do papel uyuni (precisa do servidor + canais + repo de
# bootstrap prontos) - exclui o proprio uyuni (nao faz sentido virar cliente
# de si mesmo) e o jenkins (aposentado, gated atras de enable_legacy_jenkins,
# mesmo criterio de "fora das rotinas" usado pra ele em todo o resto do lab).
- name: Onboarding da frota no Uyuni (Salt minion)
  hosts: homelab:!uyuni:!jenkins
  gather_facts: false
  tags: [uyuni_client]
  roles:
    - uyuni_client

# Jenkins foi aposentado em jul/2026 (CI migrado para o GitLab). A VM continua
# preservada; o papel so roda sob demanda, para nao ressuscitar a esteira antiga.
# Para rodar: ansible-playbook site.yml -e enable_legacy_jenkins true
- name: Jenkins (aposentado)
  hosts: jenkins
  gather_facts: true
  roles:
    - role: jenkins
      when: enable_legacy_jenkins | default(false) | bool
