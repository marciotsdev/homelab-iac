---
- name: Common baseline on all homelab VMs
  hosts: homelab
  gather_facts: true
  roles:
    - common

- name: Gitea (legacy mirror)
  hosts: gitea
  gather_facts: true
  roles:
    - gitea

- name: GitLab (git + CI)
  hosts: gitlab
  gather_facts: true
  roles:
    - gitlab

- name: GitLab runners
  hosts: gitlab-runners
  gather_facts: true
  roles:
    - gitlab_runners

- name: MiniStack (local AWS emulator)
  hosts: localstack
  gather_facts: true
  roles:
    - ministack

- name: Containers
  hosts: containers
  gather_facts: true
  roles:
    - containers

- name: AWX
  hosts: awx
  gather_facts: true
  roles:
    - awx

- name: Backstage
  hosts: backstage
  gather_facts: true
  roles:
    - backstage

# Jenkins foi aposentado em jul/2026 (CI migrado para o GitLab). A VM continua
# preservada; o papel so roda sob demanda, para nao ressuscitar a esteira antiga.
# Para rodar: ansible-playbook site.yml -e enable_legacy_jenkins true
- name: Jenkins (aposentado)
  hosts: jenkins
  gather_facts: true
  roles:
    - role: jenkins
      when: enable_legacy_jenkins | default(false) | bool
