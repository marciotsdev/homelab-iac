---
- name: Install docker
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  become: true

- name: Ensure docker is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started
  become: true

- name: Ensure local secrets directory exists (control node)
  file:
    path: "{{ gitlab_secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate/read root password (control node, idempotent)
  set_fact:
    gitlab_root_password: "{{ lookup('password', gitlab_secrets_dir + '/gitlab_root_password length=24 chars=ascii_letters,digits') }}"
  no_log: true

- name: Read keycloak client secret for gitlab SSO
  set_fact:
    gitlab_keycloak_client_secret: "{{ lookup('file', gitlab_secrets_dir + '/gitlab_keycloak_client_secret') }}"
  no_log: true

- name: Create GitLab stack directory
  file:
    path: "{{ gitlab_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Ensure GitLab trusted-certs directory exists
  file:
    path: "{{ gitlab_dir }}/config/trusted-certs"
    state: directory
    mode: "0755"
  become: true

- name: Trust the k8s-mgmt Caddy CA (needed for the Keycloak OIDC discovery)
  # Mesmo motivo do Backstage: o Caddy do k8s-mgmt roda "tls internal" (CA
  # propria por VM); sem confiar nela, o cliente HTTP do Ruby (usado pelo
  # omniauth-openid-connect no discovery) falha a verificacao TLS. O Omnibus
  # GitLab confia automaticamente em qualquer .crt/.pem colocado aqui,
  # aplicado no proximo "gitlab-ctl reconfigure" (roda sozinho no boot do
  # container).
  copy:
    src: keycloak-ca.crt
    dest: "{{ gitlab_dir }}/config/trusted-certs/keycloak-ca.crt"
    mode: "0644"
  become: true

- name: Template docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ gitlab_dir }}/docker-compose.yml"
    mode: "0600"
  become: true
  no_log: true
  register: gitlab_compose

- name: Start GitLab
  command: docker compose -f {{ gitlab_dir }}/docker-compose.yml up -d
  become: true
  register: gitlab_compose_up
  changed_when: "'Started' in gitlab_compose_up.stderr or 'Created' in gitlab_compose_up.stderr or 'Recreated' in gitlab_compose_up.stderr"

- name: Wait for GitLab to answer (first boot takes a few minutes)
  uri:
    url: "http://{{ gitlab_external_host }}:{{ gitlab_http_port }}/users/sign_in"
    status_code: 200
  register: gitlab_ready
  retries: "{{ gitlab_ready_retries }}"
  delay: "{{ gitlab_ready_delay }}"
  until: gitlab_ready is succeeded
  changed_when: false
